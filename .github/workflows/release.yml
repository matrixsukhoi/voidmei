# 自动发版流水线: push 数字开头的版本 tag (如 1.590) → CI 构建分发包 → 创建 draft Release
#
# 设计原则 (详见 CLAUDE.md "Release" 节):
#   - 代码内容由 tag 锁定: tag 事件下 checkout 的是 tag 指向的 commit,
#     master 上尚未测试的改动在机制上不可能混入发版产物
#   - data 来自常驻 data prerelease 的附件 (JSON 格式); data 上传本身不触发任何 workflow
#   - Release 一律以 draft 创建 (仅协作者可见): 测试同学验证通过后人工
#     点 "Publish release" 转正 → 进 /releases/latest, checkUpdate() 才可见。
#     发布即显式拍板动作, 测试与发布共用同一份产物, 无需重新构建
#   - workflow_dispatch + dry_run=true: 只构建不建 Release, 产物挂 artifact 供核验
name: release

on:
  push:
    # tag 命名沿用仓库历史惯例: 纯数字三段号 (1.583/1.590), 无 v 前缀 ——
    # Lutra-Fs/scoop-bucket 的 autoupdate 模板 download/$version/ 依赖此格式。
    # 数字开头通配同时排除 data 等非版本 tag
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (tag 事件自动从 tag 提取; 手动触发必填, 如 1.590)'
        required: false
        default: ''
      dry_run:
        description: 'dry-run: 不创建 Release, 仅产出 artifact 核验'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout (tag 指向的 commit — 代码内容由此锁定)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack (pnpm, 版本由 web/package.json 的 packageManager 钉定)
        run: corepack enable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: 提取版本号
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"   # 如 1.590 (tag 无 v 前缀, 与历史/scoop 约定一致)
          else
            TAG="${INPUT_VERSION:?手动触发 (workflow_dispatch) 必须填写 version}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "发布: $TAG (${{ github.event_name }})"

      - name: 下载 data 存储 (常驻 data prerelease 的 JSON 附件)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p build/fmdata
          # pattern 收窄到 RustData: data prerelease 历史上混有 Java 版 VoidMei_data(blkx) zip
          if ! gh release download data --pattern "VoidMei_RustData*" --dir build/fmdata --clobber; then
            echo "::error::data Release 不存在或无 JSON 附件, 无法组包。请先在本地执行:"
            echo "::error::  WT_GAME_DIR=<游戏目录> python script/build.py fmdata"
            echo "::error::  gh release upload data dist/VoidMei_RustData_*.zip dist/rust_data_manifest.json --clobber"
            exit 1
          fi
          ls -lh build/fmdata/
          echo "VOIDMEI_RUSTDATA_ZIP=$(ls "$(pwd)"/build/fmdata/*.zip | head -1)" >> "$GITHUB_ENV"

      - name: 组装分发包
        env:
          VOIDMEI_VERSION: ${{ steps.ver.outputs.version }}
          VOIDMEI_RUSTDATA_ZIP: ${{ env.VOIDMEI_RUSTDATA_ZIP }}
        run: |
          python script/build.py rustdist
          ls -lh dist/

      - name: 生成 Release notes (更新日志.txt 该版本条目块)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: python script/release_notes.py extract "$VERSION" > build/release_body.md

      - name: dry-run 核验 (不发布)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: VoidMei-${{ steps.ver.outputs.version }}-dryrun
          path: |
            dist/*.zip
            dist/*.sha256
            build/release_body.md
          retention-days: 7

      - name: 创建 Release (draft — 验证通过后人工 Publish 转正)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # 一律 draft: 公众不可见、不进 /releases/latest, checkUpdate() 不受影响;
          # 测试同学 (需仓库协作者权限) 下载验证后, 在 GitHub 页面点
          # "Publish release" (或 gh release edit "$TAG" --draft=false) 转正
          gh release create "$TAG" dist/*.zip dist/*.sha256 \
            --draft --title "VoidMei v$VERSION" --notes-file build/release_body.md
        shell: bash
