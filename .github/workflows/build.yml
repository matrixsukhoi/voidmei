# CI 验证流水线: push / PR 时编译并运行单元测试
# 复用本地同一构建入口 script/build.py, 保证"本地能跑 = CI 能跑"
name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 8 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 下载 fmdata (让 FM 真机验证套件跑起来, 而非跳过)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/fmdata
          # manifest 是 zip 文件名的单一真相源 (多版本 zip 并存时防误选旧包, 流程同 release.yml)
          if ! gh release download data --pattern "data_manifest.json" --dir build/fmdata --clobber; then
            echo "::error::data Release 不存在或无 data_manifest.json, FM 套件无法运行"
            exit 1
          fi
          FMDATA_ZIP=$(python3 -c "import json; print(json.load(open('build/fmdata/data_manifest.json'))['zip'])")
          if ! gh release download data --pattern "$FMDATA_ZIP" --dir build/fmdata --clobber; then
            echo "::error::manifest 指向的 $FMDATA_ZIP 不在 data Release 附件中, manifest 与附件不一致"
            exit 1
          fi
          # zip 顶层为 data/, 解压到仓库根即项目内 data/ (build.py test 的 FM 套件从这里取数)
          unzip -q "build/fmdata/$FMDATA_ZIP" -d .
          ls data/aces/gamedata/flightmodels | head -3

      - name: Compile & Test
        run: python script/build.py test

      - name: Upload jar (手动冒烟用)
        uses: actions/upload-artifact@v4
        with:
          name: VoidMei-dev-jar
          path: VoidMei.jar
          retention-days: 7
