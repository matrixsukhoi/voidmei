# CI 验证流水线: push / PR 时构建 web 前端并运行 Rust 单元测试
# 复用本地同一构建入口 script/build.py (web 子命令), 保证"本地能跑 = CI 能跑"
# 注意: webui 的 dist 未入库且被 cargo 编译期嵌入, 必须先 build web 再 cargo test
name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build web frontend
        run: python script/build.py web

      - name: Test
        run: cargo test --workspace
        working-directory: rust
