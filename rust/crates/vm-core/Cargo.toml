[package]
name = "vm-core"
version.workspace = true
edition.workspace = true
description = "VoidMei 纯逻辑层: util/parser/物理计算 (Java A 类一比一翻译目标)"

[dependencies]
# preserve_order: FM JSON (wt_ext_cli) 的 Map 用插入序 — 文本原语 getone/getlastone 的
# "首个/末个匹配"语义依赖键的文档序, 默认 BTreeMap 排序会破坏位级对拍
serde_json = { workspace = true, features = ["preserve_order"] }
# Logger 时间戳: SimpleDateFormat("HH:mm:ss.SSS") 本地时区语义 (P3 批四)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# VoiceResourceManager.installPack: java.util.zip.ZipInputStream → zip crate (P4 批七);
# 仅需读 (deflate 解压经 flate2 纯 Rust 后端), 关默认特性剔除 bzip2/lzma/aes 等
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# zip 的 deflate-flate2 不带后端选择, 显式启用 miniz_oxide 纯 Rust 后端 (特性合一)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ureq = { version = "2.12", default-features = false }
# md5: templateConfigHash 内容指纹 (波21 引入, 替代手写 RFC 1321 复刻 md5.rs)
md-5 = "0.10"
# regex: 机型对比规则/测试对拍的匹配器 (波21 引入, 替代手写 java.util.regex 复刻)
regex = "1"

[lints]
workspace = true
