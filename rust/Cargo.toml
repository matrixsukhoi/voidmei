[package]
name = "voidmei-overlay"
version = "0.1.0"
edition = "2021"
description = "VoidMei FlightInfoOverlay 的 Rust 复现 (最小复现 POC)"

# 依赖按里程碑增量引入:
#   M1: tiny-skia cosmic-text png
#   M2: windows (win) / x11rb (unix)
#   M3: serde_json
[dependencies]
png = "0.18.1"
serde_json = "1.0.151"
swash = "0.2.10"
ttf-parser = "0.25.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
# overlay 低频渲染, 体积与启动优先
opt-level = 3
lto = true
strip = true
