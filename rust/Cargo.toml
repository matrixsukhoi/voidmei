[workspace]
resolver = "2"
members = [
    "crates/vm-core",
    "crates/vm-data",
    "crates/vm-overlay",
    "crates/vm-app",
    "crates/vm-ui",
]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
vm-core = { path = "crates/vm-core" }
vm-data = { path = "crates/vm-data" }
vm-overlay = { path = "crates/vm-overlay" }
vm-ui = { path = "crates/vm-ui" }
serde_json = "1"
png = "0.18"
swash = "0.2"
ttf-parser = "0.25"
indexmap = "2"
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
# overlay 低频渲染, 体积与启动优先
opt-level = 3
lto = true
strip = true

# workspace 级 lint 豁免 (clippy 1.97 新 lint 对存量迁移代码的误伤; 各 crate
# [lints] workspace = true 生效)
[workspace.lints.clippy]
# 中文 //! 模块注释是技术注非 markdown 文档, 无序列表续行判定恒误报
doc_lazy_continuation = "allow"
# Java 构造器直译的测试惯用形 (new X() 逐字段赋值 → Default 后赋值),
# 字面量改写无语义收益
field_reassign_with_default = "allow"
