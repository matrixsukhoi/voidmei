[workspace]
resolver = "2"
members = [
    "crates/vm-core",
    "crates/vm-data",
    "crates/vm-overlay",
    "crates/vm-app",
]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
vm-core = { path = "crates/vm-core" }
vm-data = { path = "crates/vm-data" }
vm-overlay = { path = "crates/vm-overlay" }
serde_json = "1"
png = "0.18"
swash = "0.2"
ttf-parser = "0.25"
indexmap = "2"
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
# overlay 低频渲染, 体积与启动优先
opt-level = 3
lto = true
strip = true
