ui.voiceWarning.voice_aoaCrit.desc=在可用攻角达到95%和更高/攻角达到失速攻角95%或更高时，持续告警，主要用于全真和切
ui.voiceWarning.voice_aoaHigh.label=高攻角
ui.voiceWarning.voice_aoaHigh.desc=在可用攻角达到75%和更高/攻角达到失速攻角75%时告警，主要用于全真和切
ui.voiceWarning.voice_warn_stall.label=失速
ui.voiceWarning.voice_warn_stall.desc=在飞行时，表速/示空速/IAS达到计算出的真实失速速度时持续告警（在挂弹及飞机气动受损时会有少许偏差）
ui.voiceWarning.voice_warn_gear.label=起落架
ui.voiceWarning.voice_warn_gear.desc=起落架高于极限速度93%，且仍未完全回收时告警
ui.voiceWarning.voice_warn_engineoverheat.label=引擎过热
ui.voiceWarning.voice_warn_engineoverheat.desc=引擎进入最后300s耐热时时告警（通常300s也是倒数第二段耐热区间）
ui.voiceWarning.voice_warn_lowfuel.label=燃油不足
ui.voiceWarning.voice_warn_lowfuel.desc=剩余燃油仅剩起飞时的10%时告警
ui.voiceWarning.voice_warn_altitude.label=高度过低
ui.voiceWarning.voice_warn_altitude.desc=按当前下降率10s内撞击海平面时告警
ui.voiceWarning.voice_warn_terrain.label=地形告警
ui.voiceWarning.voice_warn_terrain.desc=按当前下降率10s内撞击地面时告警
ui.voiceWarning.voice_warn_flap.label=襟翼超速
ui.voiceWarning.voice_warn_flap.desc=比游戏内告警极限的多的襟翼告警，建议与minihud的智能可视化襟翼条一起使用
ui.voiceWarning.voice_warn_loadfactor.label=过载告警
ui.voiceWarning.voice_warn_loadfactor.desc=过载数达到真正会断时告警，比游戏内告警极限的多；告警不响就一定不会断，告警响后1s内恢复不会断
ui.voiceWarning.voice_rudderEff.label=方向舵劣化
ui.voiceWarning.voice_rudderEff.desc=表速超越方向舵锁舵速度瞬间告警一次，此时方向舵无法满偏，建议与minihud的智能可视化速度条一起使用
ui.voiceWarning.voice_aileronEff.label=副翼劣化
ui.voiceWarning.voice_aileronEff.desc=表速超越副翼锁舵速度瞬间告警一次，此时副翼无法满偏，建议与minihud的智能可视化速度条一起使用
ui.voiceWarning.voice_warn_lowrpm.label=转速过低
ui.voiceWarning.voice_warn_lowrpm.desc=引擎转速仅为应有转速的70%以下时持续告警，提示桨距设定问题或发动机损伤
ui.voiceWarning.voice_warn_highrpm.label=转速过高
ui.voiceWarning.voice_warn_highrpm.desc=引擎转速为极限转速的105%及以上时持续告警，提示桨距设定问题或定距桨超速问题
ui.voiceWarning.voice_warn_ias.label=表速过高
ui.voiceWarning.voice_warn_ias.desc=达到解体表速的95%或更高时持续告警，建议与minihud的智能可视化速度条一起使用
ui.voiceWarning.voice_warn_mach.label=马赫数过高
ui.voiceWarning.voice_warn_mach.desc=达到解体马赫数的95%或更高时持续告警，建议与minihud的智能可视化速度条一起使用
ui.voiceWarning.voice_fail_engine.label=引擎失效
ui.voiceWarning.voice_fail_engine.desc=负G断油告警
ui.voiceWarning.voice_warn_lowpressure.label=油压过低
ui.voiceWarning.voice_warn_lowpressure.desc=引擎出现损坏时告警一次
ui.voiceWarning.voice_fail_nofuel.label=燃油耗尽
ui.voiceWarning.voice_fail_nofuel.desc=燃油空时告警一次
ui.voiceWarning.voice_warn_highvario.label=下降率过大
ui.voiceWarning.voice_warn_highvario.desc=开启起落架时下降率高于10m/s持续告警
ui.voiceWarning.voice_warn_brake.label=减速板展开
ui.voiceWarning.voice_warn_brake.desc=开启减速板时持续告警，主要用于防止忘关减速板
ui.voiceWarning.voice_warn_compressor.label=增压器档位
ui.voiceWarning.voice_warn_compressor.desc=当最佳增压器档位需要切换时进行语音提示，仅适用于多档位增压器活塞引擎，建议与引擎控制面板的增压器显式一同使用
ui.voiceWarning.voice_start1.label=启动音效
ui.voiceWarning.voice_start1.desc=进入对局成功链接端口的提示
ui.flightLog.title=飞行记录
ui.flightLog.g0.title=记录设置
ui.flightLog.enableLogging.label=飞行记录和图表生成
ui.flightLog.enableLogging.desc=启用后台数据记录，用于生成飞行分析图表；目前SharkStat等网站逆向的飞行包线仍有相当多偏差之处，这个可以用于实测游戏内的真实性能
ui.flightLog.enableAltInformation.label=通知记录信息
ui.flightLog.enableAltInformation.desc=记录时周期性在屏幕上提示当前状态
ui.global.title=全局设置
ui.global.g0.title=全局设置
ui.global.autoStartGameMode.label=启动后自动开始
ui.global.autoStartGameMode.desc=启用后VoidMei将跳过设置窗口，直接进入游戏模式. 当你的配置稳定后可以打开此选项
ui.global.autoHideOnFocusLoss.label=游戏失焦时隐藏HUD
ui.global.autoHideOnFocusLoss.desc=当War Thunder游戏窗口失去焦点时，自动隐藏所有overlay；游戏重新获得焦点时立即恢复显示
ui.global.dataPollIntervalMs.label=数据读取频率
ui.global.dataPollIntervalMs.desc=全局数据读取频率，80ms约等于12.5Hz
ui.global.appLanguage.label=界面语言
ui.global.appLanguage.desc=切换程序界面语言，立即生效；Auto为跟随操作系统语言
ui.global.g1.title=显示偏好
ui.global.g2.title=字体
ui.global.GlobalNumFont.label=全局数字字体
ui.global.GlobalNumFont.desc=设置程序内所有数字显示的默认字体
ui.global.GlobalTextFont.label=全局文字字体
ui.global.GlobalTextFont.desc=设置程序内所有文本标签的默认字体
ui.global.g3.title=配色方案
ui.global.fontNum.label=状态字体颜色
ui.global.fontNum.desc=正常数值和状态的文字颜色
ui.global.fontLabel.label=标签字体颜色
ui.global.fontLabel.desc=参数名称标签的文字颜色
ui.global.fontUnit.label=单位字体颜色
ui.global.fontUnit.desc=数值单位(如km, m/s)的文字颜色，以及一些可视化窗口的填充色；需与告警色、状态色、标签色不同
ui.global.fontWarn.label=告警字体颜色
ui.global.fontWarn.desc=数值超出安全范围时的告警颜色，以及一些可视化窗口的填充色；需与单位色、状态色、标签色不同
ui.global.fontShade.label=阴影颜色
ui.global.fontShade.desc=文字投射阴影的颜色，以及一些可视化窗口的填充色；不要设定为完全透明
ui.global.g4.title=GPU兼容
ui.global.gpuCompatibilityMode.label=软件渲染模式
ui.global.gpuCompatibilityMode.desc=禁用GPU硬件解码，使用纯CPU渲染，开启后voidmei帧率会显著下降。适用于VoidMei与游戏GPU冲突以至只剩个位数帧率的问题。开启后需要重启程序生效。
ui.global.g5.title=调试
ui.global.enableStatusBar.label=提示8111状态变化
ui.global.enableStatusBar.desc=当War Thunder 8111端口连接状态改变时弹出通知
ui.global.AAEnable.label=启用抗锯齿
ui.global.AAEnable.desc=使文字和图形边缘更平滑
ui.global.enableLayoutDebug.label=显示布局调试
ui.global.enableLayoutDebug.desc=开启后显示UI组件的布局边界框
ui.global.httpPort.label=8111端口
ui.global.httpPort.desc=War Thunder数据端口，默认8111，模拟打桩建议9222
ui.global.g6.title=危险
ui.global.importConfig.label=导入配置
ui.global.importConfig.desc=从外部文件导入配置，导入后会与当前模板合并，保留新功能的同时设定为导入的用户配置
ui.global.factoryReset.label=恢复出厂设置
ui.global.factoryReset.desc=将所有配置完全恢复为默认模板，会创建备份文件

# ===== ui_layout.cfg 自动抽取 (extract_i18n.py, 勿手改此区段) =====
ui.welcome.g0i0.val=VoidMei 是一款开源WarThunder飞行数据显示工具，在游戏画面上叠加显示实时飞行参数。比起wtrti有诸多可视化与算法方面的优势。
ui.welcome.g1i0.val=选择打开需要使用的面板，阅读开关与选项的含义，并拖动至合适位置；所有开关与选项的影响会实时渲染以供调整
ui.welcome.g1i1.val=在WarThunder的匹配模式中即可使用，试飞与自定义模式需在难度选择中打开「允许使用网页界面」等开关
ui.welcome.g1i2.val=点击任务栏的VoidMei图标，即可重启插件
ui.welcome.g1i3.val=可寻找朋友或B站「隐居寒天」要他们的配置文件ui_layout.user.cfg，随后使用「导入配置」直接导入
ui.welcome.g1i4.val=有新版本发布时，会在启动时弹出更新提醒与下载链接；下载Release后，导入自己原先的ui_layout.user.cfg即可使用新版。更新频率至少与WarThunder大版本相同。
ui.welcome.g2i0.val=VoidMei核心功能，高度可视化的紧凑型UI，包含几乎所有空战有用信息
ui.welcome.g2i1.val=实时计算当前襟翼极限，精准到个位，便于控制襟翼
ui.welcome.g2i2.val=实时显示综合可用速度，并在同一位置显示失速与锁舵，对高低空与可变后掠翼均有效
ui.welcome.g2i3.val=计算引擎距离过热损坏的具体时间，精准控温
ui.welcome.g2i4.val=精准计算出当前哪一档增压器有最高功率，手操必备
ui.welcome.g2i5.val=实时计算当前引擎状态与引擎理论极限状态的百分比
ui.welcome.g2i6.val=计算真正的飞行轨迹曲率半径
ui.welcome.g2i7.val=根据燃油量与逆向工程实时计算出的真实过载极限，不触发报警一定不会断
ui.welcome.g2i8.val=可自定义的语音警告系统，功能齐全
ui.welcome.g2i9.val=游戏中随时呼出飞行模型数据，并支持飞机间对比
ui.welcome.g2i10.val=所见即所得的开关与选项，所有选项含有注释方便使用
ui.welcome.g3i0.val=任何配置文件的导入需要使用「全局设置」中的「导入配置」，切勿直接复制替换
ui.welcome.g3i1.val=如遇严重的低帧率问题，往往是Windows调度导致，考虑尝试：1.将游戏改为全屏窗口模式；2.开关英伟达显卡的「GPU硬件加速计划」；3.开关「全局设置」的「软件渲染模式」；4.更改独显直连/混合模式；5.联系我们
ui.welcome.g4i0.val=https://github.com/matrixsukhoi/voidmei 邮箱：seclusionalagar@outlook.com B站：隐居寒天
