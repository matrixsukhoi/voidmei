# ===== FM 属性稳定键 (FmPropKeys, 值=b* 格式串属性行冒号前段, 逐字一致) =====
fm.prop.emptyWeight=空重(kg)
fm.prop.maxFuelWeight=最大燃油重量(kg)
fm.prop.critSpeed=临界速度(km/h)
fm.prop.allowLoadFactor=允许过载(满/半油)
fm.prop.avgHeatRecovery=平均耐热条恢复速率
fm.prop.maxLiftLoad350=千米最大升力过载
fm.prop.liftLoadFactor=主升力面积因数载荷
fm.prop.oswaldEfficiency=翼展效率
fm.prop.dragAreaFactor=主阻力面积因数及加速度系数
fm.prop.inducedDragFactor=诱导阻力因数及加速度系数
fm.prop.radiatorDragCoeff=散热/油冷器阻力系数
