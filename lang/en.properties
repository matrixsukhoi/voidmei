ui.welcome.g0i0.val=VoidMei is an open-source War Thunder flight data display tool that overlays real-time flight parameters on the game. It has several visualization and algorithmic advantages over wtrti.
ui.welcome.g1i0.val=Enable the panels you need, read what the switches and options do, and drag them into place; every change renders live for instant preview
ui.welcome.g1i1.val=Works in War Thunder matchmaking modes; for test flight and custom battles enable options like "allow web interface" in the difficulty selection
ui.welcome.g1i2.val=Click the VoidMei icon in the taskbar to restart the tool
ui.welcome.g1i3.val=Ask a friend (or the author on Bilibili) for their ui_layout.user.cfg and import it via "Import configuration"
ui.welcome.g1i4.val=When a new version is released an update notice with download link appears at startup; download the Release and import your old ui_layout.user.cfg. Updates at least match War Thunder major versions.
ui.welcome.g2i0.val=VoidMei's core feature: a highly visual compact UI with nearly everything useful for air combat
ui.welcome.g2i1.val=Computes the current flap limit live, exact to the single digit, for precise flap control
ui.welcome.g2i2.val=Shows the comprehensive usable speed live, with stall and control lock-out in the same spot; works at any altitude and for variable-sweep wings
ui.welcome.g2i3.val=Computes the exact time until the engine is destroyed by overheating, for precise temperature management
ui.welcome.g2i4.val=Pinpoints which supercharger gear gives the most power right now — essential for manual engine control
ui.welcome.g2i5.val=Computes the live percentage of current engine state vs its theoretical limit
ui.welcome.g2i6.val=Computes the true radius of curvature of the flight path
ui.welcome.g2i7.val=True G-load limits computed live from fuel state and reverse engineering — if the warning stays silent, the wing will not break
ui.welcome.g2i8.val=A fully customizable voice warning system
ui.welcome.g2i9.val=Browse flight model data in game at any time, with aircraft-to-aircraft comparison
ui.welcome.g2i10.val=What-you-see-is-what-you-get switches and options, every one annotated
ui.welcome.g3i0.val=Always import configuration files through "Import configuration" in Global Settings — never copy files over directly
ui.welcome.g3i1.val=Severe frame rate drops are usually Windows scheduling; try: 1. switch the game to borderless windowed; 2. toggle the NVIDIA "GPU hardware-accelerated scheduling"; 3. toggle "software rendering mode" in Global Settings; 4. switch dedicated/hybrid GPU mode; 5. contact us
ui.welcome.g4i0.val=https://github.com/matrixsukhoi/voidmei Email: seclusionalagar@outlook.com Bilibili: 隐居寒天

