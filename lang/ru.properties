ui.welcome.g0i0.val=VoidMei — инструмент отображения полётных данных War Thunder с открытым кодом, накладывающий параметры полёта в реальном времени поверх игры. Ряд преимуществ в визуализации и алгоритмах перед wtrti.
ui.welcome.g1i0.val=Включите нужные панели, прочитайте назначение переключателей и перетащите панели на место; все изменения отображаются сразу
ui.welcome.g1i1.val=Работает в матчмейкинге War Thunder; для испытательного полёта иcustom battles включите опции вроде «разрешить веб-интерфейс» в выборе сложности
ui.welcome.g1i2.val=Нажмите значок VoidMei на панели задач, чтобы перезапустить программу
ui.welcome.g1i3.val=Попросите у друга (или у автора на Bilibili) файл ui_layout.user.cfg и импортируйте его через «Импорт конфигурации»
ui.welcome.g1i4.val=При выходе новой версии при старте появляется уведомление со ссылкой; скачайте релиз и импортируйте свой ui_layout.user.cfg. Обновления выходят как минимум под мажорные версии War Thunder.
ui.welcome.g2i0.val=Ключевая функция VoidMei: компактный наглядный UI почти со всей полезной для воздушного боя информацией
ui.welcome.g2i1.val=В реальном времени вычисляет текущий предел закрылок с точностью до единиц для точного управления
ui.welcome.g2i2.val=В реальном времени показывает совокупную доступную скорость, срыв и фиксацию рулей в одном месте; работает на любой высоте и для крыла изменяемой геометрии
ui.welcome.g2i3.val=Вычисляет точное время до разрушения двигателя от перегрева для точного контроля температуры
ui.welcome.g2i4.val=Точно определяет, какая ступень нагнетателя даёт максимум мощности прямо сейчас — необходимо при ручном управлении
ui.welcome.g2i5.val=В реальном времени считает процент текущего состояния двигателя от теоретического предела
ui.welcome.g2i6.val=Вычисляет истинный радиус кривизны траектории полёта
ui.welcome.g2i7.val=Истинные пределы перегрузки, рассчитанные на лету по запасу топлива и реверс-инжинирингу — пока предупреждение молчит, крыло не оторвётся
ui.welcome.g2i8.val=Полностью настраиваемая система голосовых предупреждений
ui.welcome.g2i9.val=Просмотр данных модели полёта в игре в любой момент, со сравнением самолётов
ui.welcome.g2i10.val=Переключатели и опции «что вижу — то получаю», каждая с пояснением
ui.welcome.g3i0.val=Импортируйте файлы конфигурации только через «Импорт конфигурации» в глобальных настройках — никогда не копируйте файлы напрямую
ui.welcome.g3i1.val=Серьёзные просадки FPS обычно вызваны планировщиком Windows; попробуйте: 1. перевести игру в оконный без рамки; 2. переключить «планирование GPU с аппаратным ускорением» NVIDIA; 3. переключить «программный рендеринг» в глобальных настройках; 4. сменить режим дискретной/гибридной графики; 5. связаться с нами
ui.welcome.g4i0.val=https://github.com/matrixsukhoi/voidmei Почта: seclusionalagar@outlook.com Bilibili: 隐居寒天

