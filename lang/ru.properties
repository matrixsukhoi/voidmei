close=Закрыть
about=О программе
aboutcontentsub1=2. Хобби-проект с открытым кодом под GPL-V3. Исходники и релизы: https://github.com/matrixsukhoi/voidmei\n\r
aboutcontentsub2=3. Цель — помочь игрокам WT лучше понимать полёт и воздушный бой. Внимание: распаковка файлов нарушает EULA — не выпячивайте это перед сотрудниками Gaijin.\n\r
aboutcontent=1. Программа никак не изменяет игру или её процессы. Все данные берутся из офлайн-распакованных файлов и HTTP/GET-запросов к официальному порту 8111.\n\r
