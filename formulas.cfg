;; VoidMei 内置公式 (出厂只读, 用户覆盖/新增写 formulas.user.cfg)
;; 格式与语言: doc/formula_system_design.md §3/§11
(formulas
  ;; 能量高度 (单位动能换算为米): E_h = E_specific / g
  (formula "energy_m" :expr "energy_jkg / g" :unit "m" :precision 0
           :desc "能量高度(单位动能换算)" :builtin 1)
  ;; 马赫数 (ISA 大气模型; 与 Deriver 手写式位级同源同值, 输入 ias/altitude)
  (formula "mach" :expr "ias_per_mach(altitude) != 0 ? ias / ias_per_mach(altitude) : 0"
           :unit "Ma" :precision 2 :desc "马赫数" :builtin 1)
  ;; 机动指数: 内油占比 (守卫语义与 hud_calculator 原式一致)
  (formula "maneuver_index"
           :expr "fm.empty_weight > 0 && (fm.empty_weight + mass_fuel) > 0 ? 1 - fm.empty_weight / (fm.empty_weight + mass_fuel) : 0"
           :unit "" :precision 2 :desc "机动指数" :builtin 1)
  ;; 演示: 速度每秒变化率 (状态原语 deriv)
  (formula "ias_rate" :expr "deriv(ias)" :unit "km/h/s" :precision 1
           :desc "表速变化率" :builtin 1)

  ;; L2 规则示例: 雷达高度 ≤500m 持续 300ms 触发 (动作消费面 toast/语音归
  ;; vm-app 后续接线, 当前触发事件落 ServiceData.rule_triggers)
  (rule "低空告警示例" :when "radio_altitude <= 500 && radio_altitude_valid"
        :hold-ms 300 :cooldown-s 5
        :actions ((toast "低空!") (flag "low_alt")))
)
