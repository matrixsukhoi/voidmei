;; VoidMei 内置公式 (出厂只读, 用户覆盖/新增写 formulas.user.cfg)
;; 格式与语言: doc/formula_system_design.md §3/§11
(formulas
  ;; 能量高度 (单位动能换算为米): E_h = E_specific / g
  (formula "energy_m" :expr "energy_jkg / g" :unit "m" :precision 0
           :desc "能量高度(单位动能换算)" :builtin 1)
  ;; 马赫数 (ISA 大气模型; 与 Deriver 手写式位级同源同值, 输入 ias/altitude)
  ;; 接管系统变量 mach (W1b 通用写回); 无 FM 时 invalid() = 本帧不接管
  ;; (保持 hasFM 守卫语义: 无 FM 时 mach 不更新, hide-when-zero 依赖)
  (formula "mach"
           :expr "fm_loaded ? (ias_per_mach(altitude) != 0 ? ias / ias_per_mach(altitude) : 0) : invalid()"
           :unit "Ma" :precision 2 :desc "马赫数" :builtin 1)
  ;; 机动指数: 内油占比 (守卫语义与 hud_calculator 原式一致)
  (formula "maneuver_index"
           :expr "fm.empty_weight > 0 && (fm.empty_weight + mass_fuel) > 0 ? 1 - fm.empty_weight / (fm.empty_weight + mass_fuel) : 0"
           :unit "" :precision 2 :desc "机动指数" :builtin 1)
  ;; 演示: 速度每秒变化率 (状态原语 deriv)
  (formula "ias_rate" :expr "deriv(ias)" :unit "km/h/s" :precision 1
           :desc "表速变化率" :builtin 1)

  ;; ===== W2: Deriver 四公式族 (接管系统变量, 与 derive.rs 逐行位级对齐) =====
  ;; 链: speed_raw → iastotascoff(SMA 校正) → speedv;an(离心式) → turn_rds/turn_rate;
  ;; sep/acceleration(差分 SMA)。窗口 50 = serviceLoopIntervalMs (Deriver::new 同参)。

  (formula "speed_raw" :expr "is_valid(indic_speed) ? indic_speed : ias / 3.6"
           :unit "m/s" :precision 2 :desc "校正空速(原始, m/s)" :builtin 1)
  (formula "iastotascooff"
           :expr "latch(speed_raw != 0, sma(tas / (speed_raw * 3.6), 50))"
           :unit "" :precision 4 :desc "表速→真空速校正系数(SMA)" :builtin 1)
  (formula "speedv" :expr "speed_raw * iastotascooff"
           :unit "m/s" :precision 2 :desc "校正真空速(SMA 平滑)" :builtin 1)
  (formula "sum_speedv" :expr "prev(speedv) + speedv"
           :unit "m/s" :precision 2 :desc "速度和(本帧+上帧)" :builtin 1)
  (formula "an"
           :expr "aviahorizon_roll != na() && aviahorizon_pitch != na() ? g * sqrt(max(ny_raw * ny_raw + 1 - 2 * ny_raw * cos(aviahorizon_roll * (3.141592653589793 / 180)) * cos((aviahorizon_pitch + aoa) * (3.141592653589793 / 180)), 0)) : g * ny_raw"
           :unit "m/s²" :precision 2 :desc "离心过载(An)" :builtin 1)
  (formula "turn_rds"
           :expr "latch(an != 0, sma(sum_speedv * sum_speedv / (4 * an), 50))"
           :unit "m" :precision 1 :desc "盘旋半径(SMA)" :builtin 1)
  (formula "turn_rate"
           :expr "latch(an != 0, sqrt(max(an / turn_rds, 0)) * (180 / 3.141592653589793))"
           :unit "°/s" :precision 2 :desc "盘旋率" :builtin 1)
  (formula "acceleration"
           :expr "sma(speedv - prev(speedv), 50) * 1000 / interval_ms"
           :unit "m/s²" :precision 1 :desc "加速度(速度差分 SMA)" :builtin 1)
  (formula "sep"
           :expr "sma(sum_speedv * (speedv - prev(speedv)) * 1000 / (2 * interval_ms * g) + vario, 50)"
           :unit "m" :precision 0 :desc "单位能量高度(SEP)" :builtin 1)

  ;; L2 规则示例: 雷达高度 ≤500m 持续 300ms 触发 (动作消费面 toast/语音归
  ;; vm-app 后续接线, 当前触发事件落 ServiceData.rule_triggers)
  (rule "低空告警示例" :when "radio_altitude <= 500 && radio_altitude_valid"
        :hold-ms 300 :cooldown-s 5
        :actions ((toast "低空!") (flag "low_alt")))

  ;; ===== W3: 速度限制比值族 + 失速速度 (接管, 位级对齐 update_speed_ratio/update_stall_speed) =====
  ;; 无 FM: 三比值归零 (hide-when-zero), unit_mach/stall 保持上次 (invalid 不接管)

  (formula "ias_ratio" :expr "ias / fm_vne(wing_sweep)" :unit "" :precision 3
           :desc "表速/VNE 比值(内部量)" :builtin 1)
  (formula "mach_ratio" :expr "mach / fm_mne(wing_sweep)" :unit "" :precision 3
           :desc "马赫/MNE 比值(内部量)" :builtin 1)
  (formula "speed_limit_ratio"
           :expr "!fm_loaded ? 0 : (ias_per_mach(altitude) == 0 || ias_ratio >= mach_ratio ? ias_ratio : mach_ratio)"
           :unit "" :precision 3 :desc "速度限制比值" :builtin 1)
  (formula "aileron_lock_ratio"
           :expr "!fm_loaded ? 0 : (ias_per_mach(altitude) == 0 || ias_ratio >= mach_ratio ? fm.aileron_eff_speed / fm_vne(wing_sweep) : fm.aileron_eff_speed / (fm_mne(wing_sweep) * ias_per_mach(altitude)))"
           :unit "" :precision 3 :desc "副翼锁止比值" :builtin 1)
  (formula "rudder_lock_ratio"
           :expr "!fm_loaded ? 0 : (ias_per_mach(altitude) == 0 || ias_ratio >= mach_ratio ? fm.rudder_eff_speed / fm_vne(wing_sweep) : fm.rudder_eff_speed / (fm_mne(wing_sweep) * ias_per_mach(altitude)))"
           :unit "" :precision 3 :desc "方向舵锁止比值" :builtin 1)
  (formula "unit_mach_limit_ratio"
           :expr "!fm_loaded ? invalid() : (ias_per_mach(altitude) == 0 || ias_ratio >= mach_ratio ? ias_per_mach(altitude) / fm_vne(wing_sweep) : 1.0 / fm_mne(wing_sweep))"
           :unit "" :precision 3 :desc "单位马赫数限制比值" :builtin 1)
  (formula "stall_lift_no_flap"
           :expr "fm.wing_area * fm.no_flaps_wing_cl_crit_high + fm.fuselage_area * fm.fuse_cl_high * (fm.no_flaps_wing_aoa_crit_high / fm.fuselage_aoa_crit_high)"
           :unit "" :precision 1 :desc "无襟翼升力面积载荷(内部量)" :builtin 1)
  (formula "stall_lift_full_flap"
           :expr "fm.wing_area * fm.full_flaps_wing_cl_crit_high + fm.fuselage_area * fm.fuse_cl_high * (fm.full_flaps_wing_aoa_crit_high / fm.fuselage_aoa_crit_high)"
           :unit "" :precision 1 :desc "满襟翼升力面积载荷(内部量)" :builtin 1)
  (formula "stall_speed"
           :expr "fm_loaded ? 3.6 * sqrt((2 * total_weight * g) / (1.225 * ((1 - flaps / 100) * stall_lift_no_flap + flaps / 100 * stall_lift_full_flap))) : invalid()"
           :unit "km/h" :precision 0 :desc "失速速度(襟翼线性混合)" :builtin 1)


  ;; ===== W4: 警告布尔 (接管, 判定式与 hud_calculator 逐条对齐) =====
  ;; 0.94999998807907104 = Java 0.95f 字面量提升 f64 的精确值 (§2.12, 不得写 0.95)

  (formula "warn_vne"
           :expr "airbrake == 100 || (fm_loaded && (ias >= fm_vne(wing_sweep) * 0.95 || mach >= fm_mne(wing_sweep) * 0.94999998807907104))"
           :unit "" :precision 0 :desc "超速警告(空气刹车满/VNE/MNE)" :builtin 1)
  (formula "warn_altitude"
           :expr "radio_altitude_valid && radio_altitude <= 500"
           :unit "" :precision 0 :desc "低空告警(雷达高度≤500m)" :builtin 1)
  (formula "warn_stall"
           :expr "fm_loaded && aoa >= fm_aoa_high(wing_sweep, flaps == 65535 || flaps == -65535 ? 0 : flaps)"
           :unit "" :precision 0 :desc "失速警告(迎角达临界)" :builtin 1)


  ;; ===== W6 补: 原 TelemetrySource 派生 getter 的同名公式 (registry 直通化后承接) =====
  (formula "vario" :expr "is_valid(indic_vario) ? indic_vario : vy"
           :unit "m/s" :precision 1 :desc "升降速度(仪表优先回退)" :builtin 1)
  (formula "ny" :expr "an / g" :unit "G" :precision 2 :desc "过载" :builtin 1)
  (formula "mach2" :expr "fm_loaded ? ias / ias_per_mach(altitude) : invalid()"
           :unit "Ma" :precision 3 :desc "马赫数(W6 备份)" :builtin 1)
  (formula "total_weight" :expr "fm_loaded ? fm.nofuel_weight + mfuel : invalid()"
           :unit "kg" :precision 0 :desc "全机重量" :builtin 1)


  ;; ===== W8: check_flap 状态机公式化 (Java checkFlap L1042-1064) =====
  ;; is_downing_flap = 变化方向 latch(增=1/减=0) 且 未稳定满 1 秒;
  ;; flap_allow_* 引用之 (白名单写回 ServiceData 同名字段)

  (formula "is_downing_flap"
           :expr "latch(flaps != prev(flaps), flaps > prev(flaps) ? 1 : 0) * (1 - stable(flaps, 1000))"
           :unit "" :precision 0 :desc "襟翼放下中(状态机)" :builtin 1)
  (formula "flap_allow_speed"
           :expr "fm_flap_allow_speed(flaps, is_downing_flap)"
           :unit "km/h" :precision 0 :desc "襟翼允许速度" :builtin 1)
  (formula "flap_allow_angle"
           :expr "fm_flap_allow_angle(ias, is_downing_flap)"
           :unit "°" :precision 0 :desc "允许襟翼角" :builtin 1)
)
